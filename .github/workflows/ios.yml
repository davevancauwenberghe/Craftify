name: Craftify iOS CI

permissions:
  contents: read

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "Craftify/**"
      - "Craftify.xcodeproj/**"
      - "CraftifyTests/**"
      - "CraftifyUITests/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: craftify-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.family }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Build app
        run: |
          xcodebuild build \
            -project "Craftify.xcodeproj" \
            -scheme "Craftify" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/CraftifyDerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Select an available simulator
        id: simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]
          ))["devices"]
          candidates = [
              (tuple(map(int, re.findall(r"\d+", runtime))), device)
              for runtime, group in devices.items()
              if "iOS" in runtime
              for device in group
              if device["name"].startswith(os.environ["DEVICE_FAMILY"])
          ]
          if not candidates:
              raise SystemExit("No matching iOS simulator is installed")
          _, device = max(candidates, key=lambda candidate: candidate[0])
          print(f"Testing on {device['name']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"id={device['udid']}\n")
          PY

      - name: Run regression and UI tests
        run: |
          xcodebuild test \
            -project "Craftify.xcodeproj" \
            -scheme "Craftify" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/CraftifyDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CraftifyTests.xcresult" \
            -only-testing:CraftifyTests \
            -only-testing:CraftifyUITests/CraftifyUITests \
            -parallel-testing-enabled NO \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
