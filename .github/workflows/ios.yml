name: Craftify iOS CI

permissions:
  contents: read

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "Craftify/**"
      - "Craftify.xcodeproj/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: craftify-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Craftify for iOS/iPadOS 18
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Build app
        run: |
          xcodebuild build \
            -project "Craftify.xcodeproj" \
            -scheme "Craftify" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/CraftifyDerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES
